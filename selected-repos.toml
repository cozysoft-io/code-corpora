# --------------------------------------------------------------------------
# Reserves
#
# Named replacements, so that a repository failing its measured band check --
# or failing dependency resolution in phase 1c -- is a substitution somebody
# already thought about rather than a fresh selection made under pressure.
# Promoting one means moving it to a `[[repo]]` entry with the split of the
# repository it replaces, and recording the replaced repository under
# `[[considered]]` with the measurement that disqualified it.
#
# `measured` is present on a reserve that has been cloned and counted with the
# same rule the corpus uses. The first round of reserves was mostly unmeasured
# and mostly did not survive contact with measurement -- `nfpm` was under the
# band, `taskflow` vendored Eigen and TBB into 667k lines, `fmt` carried a
# bundled googletest larger than its own source -- which is why measuring a
# reserve before naming it is now the practice rather than an afterthought.

