sha = "62e1aeb027097756fbe79a404b18b0dc008e2ccb"
version = "0.0.1"
grammars = []
language_servers = ["zuban"]
server_repositories = ["servers/zubanls-python"]

[[extension]]
id = "zwirn"
url = "https://codeberg.org/polymorphicengine/zwirn-zed-extension.git"
sha = "5973d4b46f280741560679cde707610bc3ec051a"
version = "0.2.0"
grammars = ["grammars/zwirn"]
language_servers = ["zwirnzi"]
server_repositories = ["servers/zwirnzi-release"]

[[bundled_extension]]
id = "zed/glsl"
source = "zed/extensions/glsl/extension.toml"
grammars = ["grammars/glsl"]
language_servers = ["glsl_analyzer"]
server_repositories = ["servers/glsl_analyzer"]

[[bundled_extension]]
id = "zed/html"
source = "zed/extensions/html/extension.toml"
grammars = ["grammars/html--html"]
language_servers = ["vscode-html-language-server"]
server_repositories = ["servers/vscode-langservers-extracted"]

[[bundled_extension]]
id = "zed/proto"
source = "zed/extensions/proto/extension.toml"
grammars = ["grammars/proto"]
language_servers = ["buf", "protobuf-language-server", "protols"]
server_repositories = ["servers/buf", "servers/protobuf-language-server", "servers/protols"]

[[bundled_extension]]
id = "zed/test-extension"
source = "zed/extensions/test-extension/extension.toml"
grammars = ["grammars/gleam--zed-test-extension"]
language_servers = ["gleam"]
server_repositories = ["servers/gleam"]

[[builtin_server]]
id = "bash-language-server"
source = "zed/crates/languages/src"
repository = "servers/bash-language-server"

