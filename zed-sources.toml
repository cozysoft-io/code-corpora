[[unavailable_server]]
extension = "cartan"
language_servers = ["cartan"]
reason = "The adapter runs cartan lsp from the counterplot Python package. Its package metadata and extension do not identify a public source Git repository."
urls = []

[[unavailable_server]]
extension = "cds-lsp"
language_servers = ["cap_cds"]
reason = "The adapter installs the proprietary @sap/cds-lsp package. No public source Git repository is published in its package metadata."
urls = []

[[unavailable_server]]
extension = "greycat"
language_servers = ["greycat"]
reason = "The adapter runs greycat lsp. The public GreyCat GitLab group publishes editor integrations and grammars, but not the CLI/compiler source."
urls = []

[[unavailable_server]]
extension = "infracost-ls"
language_servers = ["infracost-ls"]
reason = "The adapter downloads infracost/infracost-ls, but that repository is unavailable (GitHub 404); no commit can be resolved."
urls = ["https://github.com/infracost/infracost-ls"]

[[unavailable_server]]
extension = "metascript"
language_servers = ["metascript"]
reason = "The adapter runs msc lsp and links metascriptlang/metascript, but that repository is unavailable (GitHub 404); no commit can be resolved."
urls = ["https://github.com/metascriptlang/metascript"]
